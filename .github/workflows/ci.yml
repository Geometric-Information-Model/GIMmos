name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TestPlatform/TestPlatform.csproj -p:Platform=x64

      - name: Build core chain
        run: dotnet build GIMtransfer/GIMtransfer.csproj -c Debug -p:Platform=x64

      - name: Build tests
        run: dotnet build TestPlatform/TestPlatform.csproj -c Debug -p:Platform=x64

      - name: Test
        # Informational until pre-existing failures (143) are fixed
        continue-on-error: true
        run: dotnet test TestPlatform/TestPlatform.csproj -c Debug -p:Platform=x64 --no-build
